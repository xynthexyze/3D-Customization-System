<body>

  <main class="main-content">
<section class="form-container">
  <div class="form-section">
    <h2>Add Material</h2>
    <form id="addItemForm">
      <select id="material" required>
        <option value="">Select Material</option>
        <option value="Panaflex Signage">Panaflex</option>
        <option value="Tarpaulin Signage">Tarpaulin</option>
        <option value="New Material">Add a new material</option>
        <input type="text" id="material" placeholder="Add a new material" required /> <!--lalabas lang itong text box kapag ni-select yung add-->
      </select>

      <input type="number" id="stock" placeholder="No. of Material" required />

      <select id="unit" required>
        <option value="">Select Unit</option>
        <option value="SQFT">Square Foot</option>
        <option value="FT">Foot</option>
        <option value="SQINCH">Square Inch</option>
        <option value="New Measurement">Add a new measurement</option>
        <input type="text" id="measurement" placeholder="Add a new measurement" required /> <!--lalabas lang itong text box kapag ni-select yung add-->
      </select>

      <button type="submit">Add Item</button>
    </form>
  </div>

    <section>
      <div class="dashboard-box">
        <h2>Inventory</h2>
        <table class="data-table">
          <thead>
            <tr>
              <th>Material</th>
              <th>Quantity</th>
              <th>Unit</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="inventoryTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module" src="./inventory.js"></script>
</body>
</html>
