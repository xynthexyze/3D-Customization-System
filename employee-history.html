<!DOCTYPE html>

      <section class="dashboard-section">

            <thead>
              <tr>
                <th>Finished Product</th>
                <th>Project Type</th>
                <th>Customer</th>
                <th>Date Accomplished</th>
              </tr>
            </thead>
            <tbody id="order-history">
              <!-- Filled by JS -->
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <!-- JS -->
  <script src="admin-dashboard.js" type="module"></script>
